<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eurovision Party · Picker Redesign Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:              #0d0820;
      --surface:         rgba(255,255,255,0.05);
      --surface-hover:   rgba(255,255,255,0.09);
      --border:          rgba(255,255,255,0.09);
      --border-strong:   rgba(255,255,255,0.22);

      --top-color:       #FFD166;
      --top-bg:          rgba(255,209,102,0.1);
      --top-border:      rgba(255,209,102,0.3);

      --worst-color:     #FF4D6D;
      --worst-bg:        rgba(255,77,109,0.1);
      --worst-border:    rgba(255,77,109,0.3);

      --accent:          #9b59f4;
      --accent-bg:       rgba(155,89,244,0.2);
      --accent-border:   rgba(155,89,244,0.55);

      --text-1: #ede9f5;
      --text-2: rgba(237,233,245,0.72);
      --text-3: rgba(237,233,245,0.58);

      --panel-w: 1fr;
      --gap:     10px;
      --r-sm:    8px;
      --r-md:    12px;
      --r-lg:    18px;

      --font-d: 'Barlow Condensed', sans-serif;
      --font-b: 'Lexend', sans-serif;
    }

    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: var(--font-b);
      background: var(--bg);
      /* Match app gradient: warm magenta left, cool indigo right */
      background-image:
        radial-gradient(ellipse 75% 65% at 15% 10%,  rgba(140,20,100,0.45) 0%, transparent 60%),
        radial-gradient(ellipse 55% 70% at 85% 90%,  rgba(50,10,160,0.38) 0%, transparent 65%),
        radial-gradient(ellipse 40% 45% at 50% 50%,  rgba(80,20,140,0.2)  0%, transparent 70%);
      color: var(--text-1);
      -webkit-font-smoothing: antialiased;
    }

    /* ── Star sparkles ─────────────────────────────────────────────────── */
    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .star {
      position: absolute;
      width: 2px; height: 2px;
      border-radius: 50%;
      background: rgba(255,255,255,0.7);
      animation: twinkle 3s ease-in-out infinite;
    }
    @keyframes twinkle {
      0%,100% { opacity: 0.2; transform: scale(1); }
      50%      { opacity: 0.9; transform: scale(1.4); }
    }

    /* ── Root layout ───────────────────────────────────────────────────── */
    .app {
      display: grid;
      grid-template-columns: 1fr 4fr 1fr;
      height: 100vh;
      gap: var(--gap);
      padding: var(--gap);
      overflow: hidden;
      position: relative;
      z-index: 1;
    }

    /* ── Side panels (sticky by design — layout prevents scroll) ───────── */
    .panel {
      display: flex;
      flex-direction: column;
      background: rgba(18,8,40,0.65);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      height: 100%;
      overflow: hidden;
    }

    .panel-head {
      padding: 16px 15px 13px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .panel-icon { font-size: 1.4rem; line-height: 1; }

    .panel-name {
      font-family: var(--font-d);
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      line-height: 1;
      margin-top: 4px;
    }
    .panel--top   .panel-name { color: var(--top-color); }
    .panel--worst .panel-name { color: var(--worst-color); }

    .panel-sub {
      font-size: 0.65rem;
      font-weight: 400;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-top: 3px;
    }

    .panel-tally {
      font-family: var(--font-d);
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-3);
      margin-top: 8px;
    }

    .slots-list {
      flex: 1;
      overflow-y: auto;
      padding: 9px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* ── Slot ──────────────────────────────────────────────────────────── */
    .slot {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: var(--r-sm);
      border: 1.5px dashed var(--border);
      min-height: 50px;
      cursor: pointer;
      transition: background 0.13s, border-color 0.13s, transform 0.1s;
      position: relative;
    }

    .panel--top   .slot { border-color: var(--top-border); }
    .panel--worst .slot { border-color: var(--worst-border); }

    .slot:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .slot.is-over { border-style: solid; transform: scale(1.02); }
    .panel--top   .slot.is-over { background: var(--top-bg);   border-color: var(--top-color); }
    .panel--worst .slot.is-over { background: var(--worst-bg); border-color: var(--worst-color); }

    .slot.is-filled { border-style: solid; background: var(--surface-hover); }

    /* Glow when a tile is selected (keyboard mode) */
    .has-selection .slot { border-style: solid; }
    .has-selection .panel--top   .slot { box-shadow: 0 0 0 1px var(--top-border); }
    .has-selection .panel--worst .slot { box-shadow: 0 0 0 1px var(--worst-border); }

    .slot-pos {
      font-family: var(--font-d);
      font-size: 1.55rem;
      font-weight: 800;
      min-width: 42px;
      text-align: right;
      flex-shrink: 0;
      line-height: 1;
    }
    .panel--top   .slot-pos { color: var(--top-color); }
    .panel--worst .slot-pos { color: var(--worst-color); }

    .slot-body { flex: 1; min-width: 0; }

    .slot-hint {
      font-size: 0.7rem;
      color: var(--text-3);
      font-style: italic;
    }

    .slot-country {
      font-family: var(--font-d);
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-1);
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .slot-remove {
      background: none;
      border: none;
      color: var(--text-3);
      cursor: pointer;
      font-size: 0.85rem;
      width: 20px; height: 20px;
      border-radius: 4px;
      display: none;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: color 0.12s, opacity 0.12s;
      opacity: 0;
    }
    .slot:hover .slot-remove { opacity: 1; }
    .slot-remove:hover { color: var(--worst-color); }
    .slot-remove:focus-visible { outline: 2px solid var(--accent); opacity: 1; }

    /* ── Center column ─────────────────────────────────────────────────── */
    .center {
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }

    .center-head {
      flex-shrink: 0;
      padding: 0 2px 10px;
    }

    .center-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 10px;
    }

    .meta-count {
      font-family: var(--font-d);
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-2);
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .meta-picked {
      font-family: var(--font-d);
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.04em;
    }

    /* Sort only — filter buttons removed */
    .sort-row { display: flex; gap: 5px; align-items: center; }

    .sort-label {
      font-family: var(--font-d);
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-right: 2px;
    }

    .sbtn {
      font-family: var(--font-d);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 5px 14px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text-2);
      cursor: pointer;
      transition: all 0.12s;
    }
    .sbtn:hover { border-color: var(--border-strong); color: var(--text-1); }
    .sbtn.is-active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .sbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .kbd-hint {
      margin-top: 8px;
      font-size: 0.65rem;
      color: var(--text-3);
      letter-spacing: 0.04em;
    }
    kbd {
      font-family: var(--font-d);
      font-size: 0.72rem;
      padding: 1px 5px;
      border: 1px solid var(--border-strong);
      border-radius: 3px;
      background: var(--surface-hover);
      color: var(--text-2);
    }

    /* Selection banner */
    .sel-banner {
      display: none;
      margin-top: 8px;
      padding: 6px 12px;
      background: var(--accent-bg);
      border: 1px solid var(--accent-border);
      border-radius: var(--r-sm);
      font-family: var(--font-d);
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.04em;
    }
    .sel-banner.visible { display: block; }

    /* ── Participant grid — 3 columns ──────────────────────────────────── */
    .grid {
      flex: 1;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      padding: 2px 2px 24px;
      align-content: start;
    }

    /* ── Tile ──────────────────────────────────────────────────────────── */
    .tile {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 40px 14px 13px;
      background: rgba(255,255,255,0.048);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      cursor: grab;
      transition: background 0.12s, border-color 0.12s, transform 0.12s, box-shadow 0.12s;
      position: relative;
      user-select: none;
      min-height: 92px;
    }

    .tile::before {
      content: '⠿';
      position: absolute;
      left: 5px; top: 50%;
      transform: translateY(-50%);
      font-size: 0.75rem;
      color: var(--text-3);
      opacity: 0;
      transition: opacity 0.12s;
      pointer-events: none;
    }
    .tile:hover::before { opacity: 1; }

    .tile:hover {
      background: rgba(255,255,255,0.09);
      border-color: var(--border-strong);
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(0,0,0,0.4);
    }
    .tile:active { cursor: grabbing; transform: scale(0.98); }
    .tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .tile.is-dragging { opacity: 0.25; }

    .tile.is-selected {
      background: var(--accent-bg);
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(155,89,244,0.3), 0 8px 28px rgba(0,0,0,0.4);
    }

    .tile.is-ranked { opacity: 0.4; }
    .tile.is-ranked:hover { opacity: 0.75; transform: translateY(-1px); }

    .tile-flag {
      font-size: 2.4rem;
      line-height: 1;
      flex-shrink: 0;
      width: 2.6rem;
      text-align: center;
    }

    .tile-info { flex: 1; min-width: 0; }

    .tile-country {
      display: block;
      font-family: var(--font-d);
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tile-artist {
      display: block;
      font-size: 0.92rem;
      font-weight: 500;
      color: var(--text-2);
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tile-song {
      display: block;
      font-size: 0.85rem;
      font-weight: 300;
      color: var(--text-3);
      font-style: italic;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Position badge — top-right corner */
    .tile-badge {
      position: absolute;
      top: 7px; right: 8px;
      font-family: var(--font-d);
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      padding: 3px 8px;
      border-radius: 5px;
      line-height: 1.5;
      display: none;
    }
    .tile-badge.is-top {
      display: block;
      background: var(--top-bg);
      color: var(--top-color);
      border: 1px solid var(--top-border);
    }
    .tile-badge.is-worst {
      display: block;
      background: var(--worst-bg);
      color: var(--worst-color);
      border: 1px solid var(--worst-border);
    }

    /* ── Scrollbars ────────────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 2px; }

    /* ── Accessibility ─────────────────────────────────────────────────── */
    @media (prefers-contrast: high) {
      :root {
        --border: rgba(255,255,255,0.5);
        --text-2: rgba(237,233,245,0.88);
        --text-3: rgba(237,233,245,0.65);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
    }

    /* ── Mobile ────────────────────────────────────────────────────────── */
    @media (max-width: 960px) {
      html, body { overflow: auto; }
      .app {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto auto;
        height: auto; overflow: visible; min-height: 100svh;
      }
      .panel  { max-height: 230px; }
      .center { height: 65svh; min-height: 400px; }
      .grid   { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 520px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<!-- Scattered star sparkles (matching app aesthetic) -->
<div class="stars" aria-hidden="true" id="stars"></div>

<div class="app" id="app">

  <!-- ── LEFT: TOP 5 ─────────────────────────────────────────────────── -->
  <aside class="panel panel--top" role="complementary" aria-label="Top 5 best finish predictions">
    <div class="panel-head">
      <div class="panel-icon" aria-hidden="true">🏆</div>
      <h2 class="panel-name">Top 5</h2>
      <p class="panel-sub">Best finish</p>
      <div class="panel-tally" id="top-tally" aria-live="polite">0 / 5 placed</div>
    </div>
    <div class="slots-list" id="top-slots" role="list" aria-label="Top 5 prediction slots"></div>
  </aside>

  <!-- ── CENTER ──────────────────────────────────────────────────────── -->
  <main class="center" aria-label="Eurovision participants">
    <div class="center-head">
      <div class="center-meta">
        <span class="meta-count" id="count-label">Participants (0)</span>
        <span class="meta-picked" id="picked-label" aria-live="polite">0 / 10 picked</span>
      </div>
      <div class="sort-row" role="group" aria-label="Sort participants">
        <span class="sort-label">Sort</span>
        <button class="sbtn" id="btn-az" aria-pressed="false">A ↑</button>
        <button class="sbtn" id="btn-za" aria-pressed="false">Z ↓</button>
      </div>
      <p class="kbd-hint">
        Drag a tile to a slot &nbsp;·&nbsp; or click a tile, then click a slot
        &nbsp;·&nbsp; <kbd>Esc</kbd> to cancel
      </p>
      <div class="sel-banner" id="sel-banner" aria-live="polite"></div>
    </div>
    <div class="grid" id="grid" role="list" aria-label="Participants — drag or click to predict"></div>
  </main>

  <!-- ── RIGHT: WORST 5 ──────────────────────────────────────────────── -->
  <aside class="panel panel--worst" role="complementary" aria-label="Worst 5 last-place predictions">
    <div class="panel-head">
      <div class="panel-icon" aria-hidden="true">💀</div>
      <h2 class="panel-name">Worst 5</h2>
      <p class="panel-sub">Last place</p>
      <div class="panel-tally" id="worst-tally" aria-live="polite">0 / 5 placed</div>
    </div>
    <div class="slots-list" id="worst-slots" role="list" aria-label="Worst 5 prediction slots"></div>
  </aside>

</div>

<script>
'use strict';

// ── Data ──────────────────────────────────────────────────────────────────
const PARTICIPANTS = [
  { id: 'albania',     flag: '🇦🇱', country: 'Albania',     artist: 'Alis',                       song: 'Nān' },
  { id: 'armenia',     flag: '🇦🇲', country: 'Armenia',     artist: 'Simón',                      song: 'Paloma Rumba' },
  { id: 'australia',   flag: '🇦🇺', country: 'Australia',   artist: 'Delta Goodrem',              song: 'Eclipse' },
  { id: 'austria',     flag: '🇦🇹', country: 'Austria',     artist: 'Cosmó',                      song: 'Tanzschein' },
  { id: 'azerbaijan',  flag: '🇦🇿', country: 'Azerbaijan',  artist: 'Jlva',                       song: 'Just Go' },
  { id: 'belgium',     flag: '🇧🇪', country: 'Belgium',     artist: 'Essyla',                     song: 'Dancing on the Ice' },
  { id: 'bulgaria',    flag: '🇧🇬', country: 'Bulgaria',    artist: 'Dara',                       song: 'Bangaranga' },
  { id: 'croatia',     flag: '🇭🇷', country: 'Croatia',     artist: 'Lelek',                      song: 'Andromeda' },
  { id: 'cyprus',      flag: '🇨🇾', country: 'Cyprus',      artist: 'Antigoni',                   song: 'Jalla' },
  { id: 'czechia',     flag: '🇨🇿', country: 'Czechia',     artist: 'Daniel Zizka',               song: 'Crossroads' },
  { id: 'denmark',     flag: '🇩🇰', country: 'Denmark',     artist: 'Søren Torpegaard Lund',      song: 'Før vi går hjem' },
  { id: 'estonia',     flag: '🇪🇪', country: 'Estonia',     artist: 'Vanilla Ninja',              song: 'Too Epic to Be True' },
  { id: 'finland',     flag: '🇫🇮', country: 'Finland',     artist: 'Linda Lampenius & Pete P.', song: 'Liekinheitin' },
  { id: 'france',      flag: '🇫🇷', country: 'France',      artist: 'Monroe',                     song: 'Regarde-moi' },
  { id: 'georgia',     flag: '🇬🇪', country: 'Georgia',     artist: 'Bzikebi',                    song: 'On Replay' },
  { id: 'germany',     flag: '🇩🇪', country: 'Germany',     artist: 'Nico Suave',                 song: 'Alles Gut' },
  { id: 'greece',      flag: '🇬🇷', country: 'Greece',      artist: 'Elena Paparizou',            song: 'Fire & Ice' },
  { id: 'iceland',     flag: '🇮🇸', country: 'Iceland',     artist: 'Daði Freyr',                 song: 'Think About Things II' },
  { id: 'ireland',     flag: '🇮🇪', country: 'Ireland',     artist: 'Bambie Thug',                song: 'Doomsday Blue' },
  { id: 'israel',      flag: '🇮🇱', country: 'Israel',      artist: 'Eden Golan',                 song: 'Hurricane II' },
  { id: 'italy',       flag: '🇮🇹', country: 'Italy',       artist: 'Mahmood',                    song: 'Brividi Sempre' },
  { id: 'latvia',      flag: '🇱🇻', country: 'Latvia',      artist: 'Sudden Lights',              song: 'Aijā' },
  { id: 'lithuania',   flag: '🇱🇹', country: 'Lithuania',   artist: 'Silvester Belt',             song: 'Lamb' },
  { id: 'luxembourg',  flag: '🇱🇺', country: 'Luxembourg',  artist: 'TALI',                       song: 'Fighter' },
  { id: 'malta',       flag: '🇲🇹', country: 'Malta',       artist: 'Sarah Bonnici',              song: 'Loop' },
  { id: 'moldova',     flag: '🇲🇩', country: 'Moldova',     artist: 'Zdob și Zdub',              song: 'Trenuletul II' },
  { id: 'netherlands', flag: '🇳🇱', country: 'Netherlands', artist: 'Joost Klein',                song: 'Europapa' },
  { id: 'norway',      flag: '🇳🇴', country: 'Norway',      artist: 'Gåte',                       song: 'Ulveham' },
  { id: 'poland',      flag: '🇵🇱', country: 'Poland',      artist: 'Luna',                       song: 'The Tower' },
  { id: 'portugal',    flag: '🇵🇹', country: 'Portugal',    artist: 'Iolanda',                    song: 'Grito' },
  { id: 'serbia',      flag: '🇷🇸', country: 'Serbia',      artist: 'TEYA DORA',                  song: 'Ramonda' },
  { id: 'spain',       flag: '🇪🇸', country: 'Spain',       artist: 'Nebulossa',                  song: 'ZORRA' },
  { id: 'sweden',      flag: '🇸🇪', country: 'Sweden',      artist: 'Marcus & Martinus',          song: 'Unforgettable' },
  { id: 'switzerland', flag: '🇨🇭', country: 'Switzerland', artist: 'Nemo',                       song: 'The Code' },
  { id: 'ukraine',     flag: '🇺🇦', country: 'Ukraine',     artist: 'alyona alyona & Jerry Heil', song: 'Teresa & Maria' },
];

const N       = PARTICIPANTS.length; // dynamic each year
const TOP_N   = 5;
const WORST_N = 5;

// ── State ─────────────────────────────────────────────────────────────────
const picks = {
  top:   Array(TOP_N).fill(null),
  worst: Array(WORST_N).fill(null),
};
let selectedId = null;

// ── Utilities ─────────────────────────────────────────────────────────────
function ord(n) {
  const s = ['th','st','nd','rd'], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}
function byId(id) { return PARTICIPANTS.find(p => p.id === id); }

function getRank(id) {
  for (let i = 0; i < TOP_N;   i++) if (picks.top[i]   === id) return { kind: 'top',   label: ord(i + 1) };
  for (let i = 0; i < WORST_N; i++) if (picks.worst[i] === id) return { kind: 'worst', label: ord(N - WORST_N + 1 + i) };
  return null;
}
function evict(id) {
  picks.top   = picks.top.map(x => x === id ? null : x);
  picks.worst = picks.worst.map(x => x === id ? null : x);
}

// ── Actions ───────────────────────────────────────────────────────────────
function place(id, kind, index) {
  evict(id);
  picks[kind][index] = id;
  clearSel();
  render();
}
function removeSlot(kind, index) {
  picks[kind][index] = null;
  render();
}

// ── Selection ─────────────────────────────────────────────────────────────
function toggleSel(id) {
  if (selectedId === id) return clearSel();
  clearSel();
  selectedId = id;
  document.querySelector(`.tile[data-id="${id}"]`)?.classList.add('is-selected');
  document.getElementById('app').classList.add('has-selection');
  const p = byId(id);
  const banner = document.getElementById('sel-banner');
  banner.textContent = `${p.flag} ${p.country} selected — now click a slot`;
  banner.classList.add('visible');
}
function clearSel() {
  selectedId = null;
  document.querySelectorAll('.tile.is-selected').forEach(t => t.classList.remove('is-selected'));
  document.getElementById('app').classList.remove('has-selection');
  const banner = document.getElementById('sel-banner');
  banner.textContent = '';
  banner.classList.remove('visible');
}

// ── Event delegation — single listener handles all click interactions ─────
document.getElementById('app').addEventListener('click', e => {
  const rmBtn = e.target.closest('.slot-remove');
  const slot  = e.target.closest('.slot');
  const tile  = e.target.closest('.tile');

  if (rmBtn) {
    const s = rmBtn.closest('.slot');
    removeSlot(s.dataset.kind, Number(s.dataset.index));
    return;
  }

  if (slot) {
    if (selectedId) place(selectedId, slot.dataset.kind, Number(slot.dataset.index));
    return;
  }

  if (tile && !tile.classList.contains('is-selected')) {
    toggleSel(tile.dataset.id);
    return;
  }

  if (tile && tile.classList.contains('is-selected')) {
    clearSel();
    return;
  }

  clearSel();
});

// Keyboard: Escape cancels selection, Enter/Space on focused slot
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') clearSel();
});

// ── Build slots ───────────────────────────────────────────────────────────
function buildSlot(kind, index) {
  const pos   = kind === 'top' ? index + 1 : (N - WORST_N + 1 + index);
  const label = ord(pos);

  const el = document.createElement('div');
  el.className = 'slot';
  el.dataset.kind  = kind;
  el.dataset.index = index;
  el.setAttribute('role', 'listitem');
  el.setAttribute('tabindex', '0');
  el.setAttribute('aria-label', `${label} place — empty`);

  el.innerHTML = `
    <span class="slot-pos" aria-hidden="true">${label}</span>
    <div class="slot-body"><span class="slot-hint">tap a country →</span></div>
    <button class="slot-remove" aria-label="Remove from ${label} place">✕</button>
  `;

  // Drag target
  el.addEventListener('dragover',  e => { e.preventDefault(); el.classList.add('is-over'); });
  el.addEventListener('dragleave', () => el.classList.remove('is-over'));
  el.addEventListener('drop', e => {
    e.preventDefault();
    el.classList.remove('is-over');
    const id = e.dataTransfer.getData('text/plain');
    if (id) place(id, kind, index);
  });

  // Keyboard Enter/Space on slot
  el.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && selectedId) {
      e.preventDefault();
      place(selectedId, kind, index);
    }
  });

  return el;
}

// ── Build tiles ───────────────────────────────────────────────────────────
function buildTile(p) {
  const el = document.createElement('div');
  el.className = 'tile';
  el.dataset.id = p.id;
  el.setAttribute('draggable', 'true');
  el.setAttribute('role', 'listitem');
  el.setAttribute('tabindex', '0');
  el.setAttribute('aria-label', `${p.country}, ${p.artist}, ${p.song}`);

  el.innerHTML = `
    <span class="tile-flag" aria-hidden="true">${p.flag}</span>
    <div class="tile-info">
      <span class="tile-country">${p.country}</span>
      <span class="tile-artist">${p.artist}</span>
      <span class="tile-song">${p.song}</span>
    </div>
    <span class="tile-badge" aria-hidden="true"></span>
  `;

  el.addEventListener('dragstart', e => {
    e.dataTransfer.setData('text/plain', p.id);
    el.classList.add('is-dragging');
    clearSel();
  });
  el.addEventListener('dragend', () => el.classList.remove('is-dragging'));

  // Keyboard Enter/Space on tile
  el.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      e.target.click(); // delegated to app listener above
    }
  });

  return el;
}

// ── Render ────────────────────────────────────────────────────────────────
function render() {
  // Tiles
  document.querySelectorAll('.tile').forEach(el => {
    const id    = el.dataset.id;
    const rank  = getRank(id);
    const badge = el.querySelector('.tile-badge');

    if (rank) {
      el.classList.add('is-ranked');
      badge.className   = `tile-badge is-${rank.kind}`;
      badge.textContent = rank.label;
      el.setAttribute('aria-label', `${byId(id).country} — ranked ${rank.label}`);
    } else {
      el.classList.remove('is-ranked');
      badge.className   = 'tile-badge';
      badge.textContent = '';
      const p = byId(id);
      el.setAttribute('aria-label', `${p.country}, ${p.artist}, ${p.song}`);
    }
  });

  // Slots
  document.querySelectorAll('.slot').forEach(el => {
    const kind  = el.dataset.kind;
    const idx   = Number(el.dataset.index);
    const id    = picks[kind][idx];
    const p     = id ? byId(id) : null;
    const body  = el.querySelector('.slot-body');
    const rmBtn = el.querySelector('.slot-remove');
    const pos   = kind === 'top' ? idx + 1 : (N - WORST_N + 1 + idx);
    const label = ord(pos);

    if (p) {
      el.classList.add('is-filled');
      body.innerHTML = `<span class="slot-country"><span aria-hidden="true">${p.flag}</span> ${p.country}</span>`;
      rmBtn.style.display = 'flex';
      rmBtn.setAttribute('aria-label', `Remove ${p.country} from ${label} place`);
      el.setAttribute('aria-label', `${label} place: ${p.country}`);
    } else {
      el.classList.remove('is-filled');
      body.innerHTML = `<span class="slot-hint">tap a country →</span>`;
      rmBtn.style.display = 'none';
      el.setAttribute('aria-label', `${label} place — empty`);
    }
  });

  // Counters
  const topCt   = picks.top.filter(Boolean).length;
  const worstCt = picks.worst.filter(Boolean).length;
  document.getElementById('top-tally').textContent   = `${topCt} / ${TOP_N} placed`;
  document.getElementById('worst-tally').textContent = `${worstCt} / ${WORST_N} placed`;
  document.getElementById('picked-label').textContent = `${topCt + worstCt} / ${TOP_N + WORST_N} picked`;
}

// ── Sort ──────────────────────────────────────────────────────────────────
const gridEl = document.getElementById('grid');

function activateSort(activeId) {
  ['btn-az','btn-za'].forEach(id => {
    const wasActive = id === activeId;
    const b = document.getElementById(id);
    const nowActive = wasActive && !b.classList.contains('is-active');
    b.classList.toggle('is-active', nowActive);
    b.setAttribute('aria-pressed', String(nowActive));
    if (wasActive) sortGrid(nowActive ? activeId.replace('btn-','') : null);
  });
}
function sortGrid(dir) {
  const tiles = [...gridEl.querySelectorAll('.tile')];
  if (!dir) {
    const order = PARTICIPANTS.map(p => p.id);
    tiles.sort((a, b) => order.indexOf(a.dataset.id) - order.indexOf(b.dataset.id));
  } else {
    tiles.sort((a,b) => {
      const na = a.querySelector('.tile-country').textContent;
      const nb = b.querySelector('.tile-country').textContent;
      return dir === 'az' ? na.localeCompare(nb) : nb.localeCompare(na);
    });
  }
  tiles.forEach(t => gridEl.appendChild(t));
}

document.getElementById('btn-az').addEventListener('click', () => activateSort('btn-az'));
document.getElementById('btn-za').addEventListener('click', () => activateSort('btn-za'));

// ── Stars ─────────────────────────────────────────────────────────────────
(function buildStars() {
  const container = document.getElementById('stars');
  const positions = [
    [8,12],[15,45],[22,78],[35,23],[42,67],[55,8],[61,90],[68,34],
    [75,55],[82,18],[88,72],[93,40],[5,85],[30,50],[50,30],[70,15],
    [20,92],[45,5],[80,60],[10,70],[60,50],[38,82],[90,25],[25,38],
  ];
  positions.forEach(([top, left], i) => {
    const s = document.createElement('span');
    s.className = 'star';
    s.style.cssText = `top:${top}%;left:${left}%;animation-delay:${(i * 0.42) % 3}s;animation-duration:${2.5 + (i % 3) * 0.8}s;opacity:${0.3 + (i % 4) * 0.15}`;
    container.appendChild(s);
  });
})();

// ── Init ──────────────────────────────────────────────────────────────────
const topSlotsEl   = document.getElementById('top-slots');
const worstSlotsEl = document.getElementById('worst-slots');

for (let i = 0; i < TOP_N;   i++) topSlotsEl.appendChild(buildSlot('top', i));
for (let i = 0; i < WORST_N; i++) worstSlotsEl.appendChild(buildSlot('worst', i));

PARTICIPANTS.forEach(p => gridEl.appendChild(buildTile(p)));
document.getElementById('count-label').textContent = `Participants (${N})`;

render();
</script>
</body>
